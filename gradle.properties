# Reuse task outputs across builds and run independent projects' tasks at the same time. Tests that read the repository
# declare it as input (paletter.base-conventions), so a cache hit never skips a test whose data changed.
org.gradle.caching=true
org.gradle.parallel=true
# Reuse the configuration of the previous build when the build scripts and their inputs are unchanged
org.gradle.configuration-cache=true

# Maven coordinates of the published modules. The artifact ids are the Gradle project names `paletter` and
# `paletter-recipes`; the POM metadata is in build-logic (paletter.publish-conventions). See docs/releasing.md.
group=dev.opencollab.paletter
version=1.0.0-SNAPSHOT

# The bytecode level (javac --release) of the published modules, paletter and paletter-recipes. tools and examples, and
# the JDK that builds everything, stay at 21.
# TODO: 17 once the sources of the published modules compile with --release 17 (decided; the port is a later step).
#   The flip is this one line: paletter.javaTarget=17
paletter.javaTarget=21
