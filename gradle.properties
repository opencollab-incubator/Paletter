# Reuse task outputs across builds and run independent projects' tasks at the same time. Tests that read the repository
# declare it as input (root build.gradle.kts), so a cache hit never skips a test whose data changed.
org.gradle.caching=true
org.gradle.parallel=true
# Reuse the configuration of the previous build when the build scripts and their inputs are unchanged
org.gradle.configuration-cache=true

# Maven coordinates and POM metadata of the published modules. The single place to change them. PENDING the user's
# confirmation (group id, artifact ids = the Gradle project names `paletter` and `paletter-recipes`, POM metadata).
group=org.geysermc.paletter
version=1.0.0-SNAPSHOT
paletter.pom.url=https://github.com/opencollab-incubator/Paletter
paletter.pom.scm=opencollab-incubator/Paletter
paletter.pom.organization=Open Collaboration
paletter.pom.organizationUrl=https://github.com/opencollab
# Remote repositories, used only with -Ppaletter.deploy=true (see docs/releasing.md); credentials come from the
# paletterRepoUser / paletterRepoPassword properties, never from the repository
paletter.repo.releases=https://repo.opencollab.dev/maven-releases
paletter.repo.snapshots=https://repo.opencollab.dev/maven-snapshots
