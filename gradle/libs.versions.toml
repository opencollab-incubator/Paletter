[versions]
# Keep in sync with Geyser's gradle/libs.versions.toml
protocol = "3.0.0.Beta15-20261026.210753-2"
# CloudburstMC/Network, "nethernet" branch (tools client only); keep in sync with Geyser
network = "2.0.0.CR6-20261030.131938-23"
libdatachannel = "0.24.6.0-20261029.091642-10"
fastutil = "8.5.15"
checker = "3.19.0"
gson = "2.10.1"
# Code generation only (tools module), never a dependency of paletter. square/javapoet is archived; this is its maintained fork
javapoet = "0.22.0"
junit = "6.0.0"
picocli = "4.7.7"

[libraries]
protocol-codec = { group = "org.cloudburstmc.protocol", name = "bedrock-codec", version.ref = "protocol" }
protocol-connection = { group = "org.cloudburstmc.protocol", name = "bedrock-connection", version.ref = "protocol" }
fastutil-int-object = { group = "org.cloudburstmc.fastutil.maps", name = "int-object-maps", version.ref = "fastutil" }
fastutil-object-int = { group = "org.cloudburstmc.fastutil.maps", name = "object-int-maps", version.ref = "fastutil" }
fastutil-object-object = { group = "org.cloudburstmc.fastutil.maps", name = "object-object-maps", version.ref = "fastutil" }
checker-qual = { group = "org.checkerframework", name = "checker-qual", version.ref = "checker" }
nethernet = { group = "org.cloudburstmc.netty", name = "netty-transport-nethernet", version.ref = "network" }
raknet = { group = "org.cloudburstmc.netty", name = "netty-transport-raknet", version.ref = "network" }
libdatachannel = { group = "dev.opencollab", name = "libdatachannel-java-arch-detect", version.ref = "libdatachannel" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
picocli = { group = "info.picocli", name = "picocli", version.ref = "picocli" }
javapoet = { group = "com.palantir.javapoet", name = "javapoet", version.ref = "javapoet" }
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
