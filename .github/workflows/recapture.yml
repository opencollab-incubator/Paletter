# Full recapture: every kept BDS build and the newest preview, captured again in parallel with the add-on generated from
# the checked-out commit, and turned into ONE pull request: docs/data-pipeline.md, "Full recapture". Started by hand
# (workflow_dispatch: `ref`, `builds`, `dry-run`) or by the `recapture` label on a pull request of a branch of this
# repository, added by someone with write access; nothing starts it on a push or a schedule.
#
# Security: the same split as bds-data.yml, in four jobs.
#   plan      read-only. `recapture plan` lists the committed builds of the checkout (no network) and the commit every
#             job uses.
#   capture   read-only, one Windows job per build. Runs the downloaded BDS binary and Gradle: untrusted code, so it has
#             `contents: read`, no credentials in the checkout and no secrets. It can only hand over files as an artifact.
#   assemble  read-only. `recapture assemble` treats the artifacts as data (the builds of the plan, only plain files and
#             directories, every path on an allow-list, a size cap; all valid or nothing staged), lays them over
#             data/bds/<build> and runs the sequential half. It runs Gradle over data from the capture jobs, so it has no
#             write permission and no secret either; it hands over a patch of the data paths and a report.
#   publish   the only job with write permissions. Runs no Gradle or BDS and no repository code but
#             .github/actions/data-pr from the pinned checkout of the branch, and applies only a patch confined to the
#             data paths. Skipped with `dry-run`.
# No script of an artifact is ever run, and no value of an artifact reaches a shell as code.
#
# The capture platform stays Windows (`CapturePlatform`): the committed captures come from Windows BDS, and the daily
# check captures on GitHub's Windows runners too. `update` refuses to run against committed captures of another platform.
#
# Pull requests opened with GITHUB_TOKEN do not start other workflows, so publish starts build.yml on them by hand.

name: Recapture

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to recapture and open the pull request against (empty: the branch this run was started on)"
        required: false
        type: string
      builds:
        description: "Only these builds of the plan, separated by spaces or commas (a rehearsal; empty: every build of the plan)"
        required: false
        type: string
      dry-run:
        description: "Capture and assemble only: no pull request (the patch and the report stay artifacts)"
        type: boolean
        default: false
  # On a pull request: adding the `recapture` label runs it against the pull request's branch (remove and add the label
  # to run it again). Only for branches of this repository: a fork's pull request has no write token for the publish job.
  pull_request:
    types: [labeled]

permissions: {}

env:
  # A BDS build number: the format of `BuildNumber` (tools), whose test keeps this regex equal to BuildNumber.REGEX
  BUILD_RE: '^1(\.[0-9]{1,9}){3}$'

concurrency:
  group: recapture
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      github.event_name != 'pull_request' || (github.event.label.name == 'recapture'
      && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      legs: ${{ steps.plan.outputs.legs }}
      sha: ${{ steps.plan.outputs.sha }}
      base: ${{ steps.plan.outputs.base }}
    env:
      # A pull request's run captures its head branch (github.ref_name is the merge ref there)
      INPUT_REF: ${{ inputs.ref || github.head_ref }}
      RUN_REF: ${{ github.ref_name }}
      INPUT_BUILDS: ${{ inputs.builds }}
    steps:
      # Triage access is enough to add a label, and the run publishes with write access: only someone who can push to
      # the repository starts it. The only step with the token, before any repository code runs: gh and nothing else
      - name: Check who added the label
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          echo "$SENDER" | grep -Eqx '[A-Za-z0-9-]{1,39}(\[bot\])?' || { echo "Bad sender"; exit 1; }
          PERMISSION=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$SENDER/permission" --template '{{.permission}}')
          case "$PERMISSION" in
            admin|write) ;;
            *) echo "::error::$SENDER has $PERMISSION access; adding the recapture label takes write access"; exit 1 ;;
          esac
      # The branch name is checked before anything uses it
      - name: Check the branch name
        run: |
          BASE="${INPUT_REF:-$RUN_REF}"
          if ! echo "$BASE" | grep -Eq '^[A-Za-z0-9._/-]{1,100}$' || echo "$BASE" | grep -Eq '(^|/)\.\.?(/|$)'; then
            echo "Not a branch name: '$BASE'"; exit 1
          fi
          echo "BASE=$BASE" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE }}
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      # The committed builds of the checkout only, with no request to the network; `builds` narrows them to a rehearsal.
      # Frozen builds (their zip is gone from minecraft.net) are left out, and said so in the summary
      - name: List the builds
        id: plan
        run: |
          set -f
          ARGS=(recapture plan --outputs "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY")
          for B in $(echo "$INPUT_BUILDS" | tr ',' ' '); do
            echo "$B" | grep -Eq "$BUILD_RE" || { echo "Not a build: '$B'"; exit 1; }
            ARGS+=(--build "$B")
          done
          "$TOOLS" "${ARGS[@]}"
          { echo "sha=$(git rev-parse HEAD)"; echo "base=$BASE"; } >> "$GITHUB_OUTPUT"

  capture:
    needs: plan
    if: needs.plan.outputs.legs != '0'
    # The image of the daily check (bds-data.yml), fixed for the same reason
    runs-on: windows-2025
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # The runners are shared: a few builds at a time keeps the downloads from minecraft.net and the queue polite
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # One job at a time per build across both data workflows, so no two download the same zip
    concurrency:
      group: bds-zip-${{ matrix.build }}
      cancel-in-progress: false
    defaults:
      run:
        # Git Bash on the Windows runner
        shell: bash
    env:
      BUILD: ${{ matrix.build }}
      CHANNEL: ${{ matrix.channel }}
    steps:
      # The data is compared byte for byte: keep the checkout's line endings as committed (LF)
      - name: Check out with LF line endings
        run: git config --global core.autocrlf false
      # The commit of the plan, so that every leg generates the same add-on
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      # The zips of the build (the daily check's cache entries too), saved before BDS runs; checks the build and channel
      - uses: ./.github/actions/setup-tools
        with:
          build: ${{ matrix.build }}
          channel: ${{ matrix.channel }}

      # The capture half of `update`: the captures of this build into a directory of their own, nothing into the
      # checkout; a build kept by a history check is captured as one, and a run without a spec capture fails
      - name: Capture the build
        id: run
        run: '"$TOOLS" update --channel "$CHANNEL" --version "$BUILD" --capture-only "$CI_TEMP/out/captures" --report "$CI_TEMP/out/report.md"'
      - name: Summarize
        if: always()
        run: if [ -f "$CI_TEMP/out/report.md" ]; then head -c 60000 "$CI_TEMP/out/report.md" >> "$GITHUB_STEP_SUMMARY"; fi

      # Only a leg that succeeded hands over captures: nothing half captured is ever assembled
      - name: Upload the captures
        if: steps.run.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: captures-${{ matrix.build }}
          path: ${{ env.CI_TEMP }}/out/

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capture-logs-${{ matrix.build }}
          path: |
            ${{ env.PALETTER_BDS_CACHE }}/runs/*/*.log
            ${{ env.PALETTER_BDS_CACHE }}/runs/*/report.md
          if-no-files-found: ignore

  # All legs or none: captures of different add-ons must never end up in one pull request. A failed leg is re-run
  # from the Actions page ("Re-run failed jobs"), which starts this job again.
  assemble:
    needs: [plan, capture]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.capture.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.result.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      # Gradle runs over data from the capture jobs here: the Gradle cache is read only (setup-tools)
      - uses: ./.github/actions/setup-tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: captures-*
          path: ${{ runner.temp }}/in

      # Validates and stages the artifacts, clones the third-party behaviour dumps at the pins of
      # data/behaviour/sources.json, runs the steps after the captures in their order and writes the report. Exit 3: a step
      # changed an input of the spec add-on; commit that change and run this workflow again
      - name: Assemble
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          printf '%s' "$MATRIX" > "$RUNNER_TEMP/plan.json"
          set +e
          "$TOOLS" recapture assemble --plan "$RUNNER_TEMP/plan.json" --in "$RUNNER_TEMP/in" --out "$RUNNER_TEMP/out" \
            --fetch-sources "$RUNNER_TEMP/sources" --commit "$SHA"
          CODE=$?
          if [ -f "$RUNNER_TEMP/out/report.md" ]; then head -c 60000 "$RUNNER_TEMP/out/report.md" >> "$GITHUB_STEP_SUMMARY"; fi
          exit $CODE

      - name: Upload what the inference changed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recapture-guard-diff
          path: |
            ${{ runner.temp }}/out/addon-inputs/
            ${{ runner.temp }}/out/model.diff
          if-no-files-found: ignore

      # The API dumps compile what the generators wrote; then the patch of the data paths, which publish reads
      - name: Write the patch
        run: |
          ./gradlew :paletter:apiDump :paletter-recipes:apiDump
          git add -A -- $(cat .github/data-paths.txt)
          git diff --cached --binary --no-renames -- $(cat .github/data-paths.txt) > "$RUNNER_TEMP/out/data.patch"

      - name: Upload the result
        id: result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recapture-result
          path: |
            ${{ runner.temp }}/out/report.md
            ${{ runner.temp }}/out/data.patch

  publish:
    needs: [plan, assemble]
    if: ${{ !cancelled() && needs.assemble.result == 'success' && inputs.dry-run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      # Starts build.yml on the pull request
      actions: write
    steps:
      # Checked again here: this job holds the token, and the branch name ends up in a ref and a pull request base
      - name: Check the branch name
        env:
          BASE: ${{ needs.plan.outputs.base }}
        run: |
          if ! echo "$BASE" | grep -Eq '^[A-Za-z0-9._/-]{1,100}$' || echo "$BASE" | grep -Eq '(^|/)\.\.?(/|$)'; then
            echo "Not a branch name: '$BASE'"; exit 1
          fi
      # The branch itself (create-pull-request needs one), at the commit the plan pinned
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.base }}
          persist-credentials: false
      - name: Check that the branch did not move
        env:
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          echo "$SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "Bad sha"; exit 1; }
          if [ "$(git rev-parse HEAD)" != "$SHA" ]; then
            echo "::error::The branch moved during the run, so the patch does not belong to it. Run this workflow again."; exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.assemble.outputs.artifact-id }}
          path: ${{ runner.temp }}/in
          merge-multiple: true

      # Only patches confined to the data paths (the checks shared with bds-data.yml); anything else fails the job before
      # the working tree changes. The report of the run (written by assemble) is the pull request body
      - name: Open or update the pull request
        uses: ./.github/actions/data-pr
        with:
          patch: ${{ runner.temp }}/in/data.patch
          base: ${{ needs.plan.outputs.base }}
          branch: recapture/${{ needs.plan.outputs.base }}
          title: "Recapture every BDS build with the current add-on"
          commit-message: "Recapture every BDS build with the current add-on"
          report: ${{ runner.temp }}/in/report.md
