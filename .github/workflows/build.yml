name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its running build; builds of main all run
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Only main writes the Gradle cache; pull requests (also from forks) only read it. This is setup-gradle's
          # default, stated so it cannot change with a version bump
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      # build runs check: all tests, the Javadoc, the API dump, the generated code (checkConstants, checkComponentApi),
      # checkMappings (every captured bit and wire path is explained), checkData (fallback coverage of the bundled
      # versions) and checkReleaseDependencies (no floating snapshot in what is published). Publishing is publish.yml
      - run: ./gradlew build
      # What publish.yml uploads, into the local repository only: the POMs, sources and Javadoc jars build here too
      - run: ./gradlew publishToMavenLocal
