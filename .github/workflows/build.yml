name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Only main writes the Gradle cache; pull requests (also from forks) and other branches only read it. This is
          # setup-gradle's default, stated so it cannot change with a version bump
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
      # build includes :tools:checkComponentApi (generated component API up to date) and all tests
      - run: ./gradlew build
      - name: Every captured bit and wire path is explained
        run: ./gradlew :tools:run --args="check-mappings --strict"
      - name: Fallback coverage of the bundled versions
        run: ./gradlew :tools:run --args="check-data"
