name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # build includes :codegen:checkComponents (generated component types up to date) and all tests
      - run: ./gradlew build
      - name: Every captured bit and wire path is explained
        run: ./gradlew :tools:run --args="check-mappings --strict"
      - name: Fallback coverage of the bundled versions
        run: ./gradlew :tools:run --args="check-data"
