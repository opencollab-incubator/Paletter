# Security: the job that runs untrusted code (the downloaded BDS binary, Gradle and its dependencies, the tools) is
# `capture`. It can only read the repository, keeps no credentials in the checkout and sees no secrets. It hands over the
# report and a patch of the data paths as artifacts. `publish` holds the write permissions and BDS_DATA_TOKEN, runs no
# Gradle, BDS or repository script, applies only patches confined to the data paths and passes report text as files.
#
# Daily check of the newest Bedrock Dedicated Server release and preview against the committed data.
#
# Per channel: resolves the newest build (or the `version` input), then runs `update --verify-only` on Windows BDS
# (downloaded from minecraft.net; that means accepting the Minecraft EULA, https://minecraft.net/eula). The committed
# captures come from Windows BDS, and Linux BDS numbers custom blocks, orders the creative inventory and encodes some
# component NBT differently, so the captures run on Windows too (`update` refuses to compare captures of different
# platforms). When the run fails or finds differences:
#   - an issue labelled `bds-data` + `<channel>` is opened, or the open one gets a comment when the report changed
#     (dates and paths ignored), so a standing difference does not spam;
#   - the pipeline runs again in update mode and regenerates the component API, and `peter-evans/create-pull-request`
#     opens (or updates) a pull request from branch `bds-data/<channel>` with the new data. Releases and previews are
#     imported alike: a preview is bundled as a preview version (served with `paletter.previews`, its API marked
#     `@SincePreview`) and replaces the preview before it; its release drops it. The update writes its report to
#     `data/bds/<build>/update-report.md` (committed with the data, and the body of the pull request). It exits with 2
#     when the report lists decisions: the pull request is still opened, for a human to decide them; any other failure
#     fails the run after the issue is updated.
# A manual run can check one channel only, and with `verify-only` stops after the report (no issue, no pull request).
#
# Windows runner assumptions: BDS and the capture client talk over loopback only (127.0.0.1: RakNet and NetherNet
# signaling on server-port, NetherNet LAN discovery on UDP 7551). Windows Firewall does not filter loopback, and nothing
# runs elevated or needs a UWP loopback exemption (that is only for the Bedrock client app). NetherNet's WebRTC uses
# host candidates only (no STUN/TURN), and libdatachannel ships a Windows x64 native. No WSL is needed: the tools run
# the Windows BDS directly; only the BDS inventory step downloads the Linux zip to read its binary.
#
# Pull requests opened with GITHUB_TOKEN do not trigger other workflows; to run the build on them, use a fine grained
# PAT (contents + pull requests: read and write) in a `BDS_DATA_TOKEN` secret, which `publish` prefers when it exists.
# The repository setting "Allow GitHub Actions to create and approve pull requests" must be enabled.

name: BDS data

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel to check"
        type: choice
        options: [both, release, preview]
        default: both
      version:
        description: "BDS version (empty: newest of each channel)"
        required: false
      verify-only:
        description: "Only verify and upload the report (no issue, no pull request)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: bds-data
  cancel-in-progress: false

jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(inputs.channel == 'release' && '["release"]' || inputs.channel == 'preview' && '["preview"]' || '["release","preview"]') }}
    defaults:
      run:
        # Git Bash on the Windows runner
        shell: bash
    env:
      CHANNEL: ${{ matrix.channel }}
      INPUT_VERSION: ${{ inputs.version }}
      # Scheduled runs have no inputs: false
      VERIFY_ONLY: ${{ inputs.verify-only == true }}
    steps:
      # Everything temporary lives in the runner's temp directory, never in the checkout. Forward slashes: Java, bash
      # and the actions all read them; outside the checkout as an absolute path, as upload-artifact rejects '..'.
      - name: Set the temp and BDS cache directories
        run: |
          CI_TEMP=$(cygpath -m "$RUNNER_TEMP")
          echo "CI_TEMP=$CI_TEMP" >> "$GITHUB_ENV"
          echo "PALETTER_BDS_CACHE=$CI_TEMP/bds-cache" >> "$GITHUB_ENV"
          mkdir -p "$CI_TEMP/out"
      # The data is compared byte for byte: keep the checkout's line endings as committed (LF)
      - name: Check out with LF line endings
        run: git config --global core.autocrlf false
      # The build every step uses, also the key of the download cache
      - name: Resolve the BDS version
        id: bds
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            TYPE=serverBedrockWindows
            if [ "$CHANNEL" = preview ]; then TYPE=serverBedrockPreviewWindows; fi
            URL=$(curl -sf -A Paletter https://net-secondary.web.minecraft-services.net/api/v1.0/download/links \
              | jq -r --arg type "$TYPE" '.result.links[] | select(.downloadType == $type) | .downloadUrl')
            VERSION=$(basename "$URL" .zip | sed 's/^bedrock-server-//')
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+)+$'; then echo "No BDS version: '$VERSION'"; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "BDS_VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Cache BDS downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PALETTER_BDS_CACHE }}/zips
          key: bds-zips-windows-${{ matrix.channel }}-${{ steps.bds.outputs.version }}

      - name: Verify against the committed data
        id: verify
        run: |
          set +e
          REPORT="$CI_TEMP/out/report.md"
          ./gradlew :tools:run --args="update --channel $CHANNEL --version $BDS_VERSION --verify-only --report $REPORT"
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          if [ -f "$REPORT" ]; then
            # The report without the lines that change every run (date, paths)
            echo "hash=$(grep -v -e '^- \*\*Date\*\*' -e '^- \*\*Work directory' -e '^- \*\*Server' "$REPORT" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
            head -c 60000 "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      # Writes the data into the checkout only; publish turns it into a pull request
      - name: Update the data
        id: update
        if: steps.verify.outputs.exit != '0' && env.VERIFY_ONLY != 'true'
        run: |
          set +e
          ./gradlew :tools:run --args="update --channel $CHANNEL --version $BDS_VERSION"
          CODE=$?
          echo "exit=$CODE" >> "$GITHUB_OUTPUT"
          # 2: everything written, decisions pending; the pull request is opened for them
          if [ "$CODE" != 0 ] && [ "$CODE" != 2 ]; then echo "update failed with exit code $CODE"; exit 0; fi
          set -e
          # The component API follows the inferred mappings
          ./gradlew :tools:generateComponentApi
          # Only the data paths, new files included, without renames (publish checks every path)
          git add -A -- data paletter/src/main/resources/paletter paletter/src/generated paletter/api
          git diff --cached --binary --no-renames -- data paletter/src/main/resources/paletter paletter/src/generated paletter/api \
            > "$CI_TEMP/out/data.patch"

      # What publish reads: values only, checked again there
      - name: Write the result
        if: always()
        env:
          VERIFY_EXIT: ${{ steps.verify.outputs.exit }}
          HASH: ${{ steps.verify.outputs.hash }}
          UPDATE_EXIT: ${{ steps.update.outputs.exit }}
        run: |
          {
            echo "version=$BDS_VERSION"
            echo "verify=$VERIFY_EXIT"
            echo "hash=$HASH"
            echo "update=$UPDATE_EXIT"
          } > "$CI_TEMP/out/result.txt"

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bds-data-${{ matrix.channel }}
          path: ${{ env.CI_TEMP }}/out/
          if-no-files-found: ignore

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bds-logs-${{ matrix.channel }}
          path: |
            ${{ env.PALETTER_BDS_CACHE }}/runs/*/*.log
            ${{ env.PALETTER_BDS_CACHE }}/runs/*/report.md
          if-no-files-found: ignore

  publish:
    needs: capture
    if: ${{ !cancelled() && inputs.verify-only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(inputs.channel == 'release' && '["release"]' || inputs.channel == 'preview' && '["preview"]' || '["release","preview"]') }}
    env:
      CHANNEL: ${{ matrix.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bds-data-${{ matrix.channel }}
          path: ${{ runner.temp }}/in

      # Values from the capture job are data: checked against strict patterns, never sourced or interpolated
      - name: Read the result
        id: result
        run: |
          IN="$RUNNER_TEMP/in"
          value() { grep -m1 "^$1=" "$IN/result.txt" | cut -d= -f2-; }
          VERSION=$(value version); VERIFY=$(value verify); HASH=$(value hash); UPDATE=$(value update)
          echo "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+)+$' || { echo "Bad version"; exit 1; }
          echo "$VERIFY" | grep -Eq '^[0-9]*$' || { echo "Bad verify exit code"; exit 1; }
          echo "$UPDATE" | grep -Eq '^[0-9]*$' || { echo "Bad update exit code"; exit 1; }
          echo "$HASH" | grep -Eq '^[0-9a-f]*$' || { echo "Bad hash"; exit 1; }
          {
            echo "version=$VERSION"
            echo "verify=$VERIFY"
            echo "hash=$HASH"
            echo "update=$UPDATE"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update the issue
        if: steps.result.outputs.verify != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          HASH: ${{ steps.result.outputs.hash }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create bds-data --color 1d76db --description "Automated BDS data check" 2>/dev/null || true
          gh label create "$CHANNEL" --color c5def5 2>/dev/null || true
          TITLE="BDS data: $CHANNEL differs from the committed data"
          ISSUE="$RUNNER_TEMP/issue.md"
          MARKER="<!-- report-hash: $HASH -->"
          {
            echo "$MARKER"
            echo "Run: $RUN_URL"
            echo
            # GitHub limits bodies to 65536 characters
            if [ -f "$RUNNER_TEMP/in/report.md" ]; then head -c 60000 "$RUNNER_TEMP/in/report.md"; else echo "The run wrote no report; see the logs."; fi
          } > "$ISSUE"
          NUMBER=$(gh issue list --label bds-data --label "$CHANNEL" --state open --json number --jq '.[0].number')
          if [ -z "$NUMBER" ]; then
            gh issue create --title "$TITLE" --label bds-data --label "$CHANNEL" --body-file "$ISSUE"
          elif ! gh issue view "$NUMBER" --json body,comments --jq '[.body] + [.comments[].body] | join("\n")' | grep -qF "$MARKER"; then
            gh issue comment "$NUMBER" --body-file "$ISSUE"
          else
            echo "Issue #$NUMBER already has this report"
          fi

      # Only patches confined to the data paths; anything else fails the job before the working tree changes
      - name: Apply the data
        id: apply
        if: steps.result.outputs.update == '0' || steps.result.outputs.update == '2'
        env:
          VERSION: ${{ steps.result.outputs.version }}
        run: |
          PATCH="$RUNNER_TEMP/in/data.patch"
          if [ ! -s "$PATCH" ]; then echo "No data changes"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          # One path per file (no renames in the patch); a quoted path with unusual characters fails the check below
          git apply --numstat "$PATCH" | cut -f3 > "$RUNNER_TEMP/paths.txt"
          if grep -Ev '^(data/|paletter/src/main/resources/paletter/|paletter/src/generated/|paletter/api/)' "$RUNNER_TEMP/paths.txt" \
              || grep -E '(^|/)\.\.(/|$)' "$RUNNER_TEMP/paths.txt"; then
            echo "The patch touches paths outside the data paths"; exit 1
          fi
          git apply --check "$PATCH"
          git apply "$PATCH"
          # The versioned report, committed with the data, is the pull request body
          head -c 60000 "data/bds/$VERSION/update-report.md" > "$RUNNER_TEMP/pr-body.md"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update the pull request
        if: steps.apply.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.BDS_DATA_TOKEN || github.token }}
          branch: bds-data/${{ matrix.channel }}
          delete-branch: true
          title: "Update bundled data from the newest BDS ${{ matrix.channel }}"
          commit-message: "Update bundled data from the newest BDS ${{ matrix.channel }}"
          body-path: ${{ runner.temp }}/pr-body.md
          labels: bds-data
          add-paths: |
            data/**
            paletter/src/main/resources/paletter/**
            paletter/src/generated/**
            paletter/api/**

      - name: Fail on a failed update
        if: steps.result.outputs.update != '' && steps.result.outputs.update != '0' && steps.result.outputs.update != '2'
        env:
          UPDATE: ${{ steps.result.outputs.update }}
        run: |
          echo "update failed with exit code $UPDATE; see the bds-logs artifact"
          exit 1
