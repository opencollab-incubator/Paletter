# Daily check of the newest Bedrock Dedicated Server release and preview: docs/data-pipeline.md, "The daily check".
#
# `decide` asks the download links API once for both channels and captures only a build that is new: not recorded in
# data/bds/builds.json, without data/bds/<build>, not waiting in the open data pull request, not failed twice at this
# commit. `capture` runs `update` on Windows BDS (downloaded from minecraft.net; that means accepting the Minecraft EULA,
# https://minecraft.net/eula). `publish` turns new data into a pull request from `bds-data/<channel>` and a failure into
# an issue; it closes the channel's failure issue after a clean run. A manual run can pick one channel, an explicit
# `version`, `force` (capture a known build) and `verify-only` (`update --verify-only`, which also forces; no issue,
# no pull request).
#
# Security: `decide` runs repository code with read scopes; its token is in the environment of the `gh` step only,
# which runs before any repository code. `capture` runs untrusted code (the BDS binary, Gradle, the tools) with
# `contents: read`, no credentials in the checkout and no secrets, and hands over the report and a patch as artifacts.
# `publish` holds the write permissions and BDS_DATA_TOKEN, runs no Gradle or BDS and no repository code but the patch
# checks of .github/actions/apply-data-patch from its own checkout, and reads artifact values against strict patterns.
#
# Windows runner assumptions: BDS and the capture client talk over loopback only (127.0.0.1: RakNet and NetherNet
# signaling on server-port, NetherNet LAN discovery on UDP 7551). Windows Firewall does not filter loopback, and nothing
# runs elevated or needs a UWP loopback exemption (that is only for the Bedrock client app). NetherNet's WebRTC uses
# host candidates only (no STUN/TURN), and libdatachannel ships a Windows x64 native. No WSL is needed: the tools run
# the Windows BDS directly; only the BDS inventory step downloads the Linux zip to read its binary.
#
# Pull requests opened with GITHUB_TOKEN do not trigger other workflows: set BDS_DATA_TOKEN (docs/releasing.md) to run
# the build on them. A patch that changes generated code is only turned into a pull request with it.

name: BDS data

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel to check"
        type: choice
        options: [both, release, preview]
        default: both
      version:
        description: "BDS version (empty: newest of the channel; one channel only)"
        required: false
      force:
        description: "Capture the build even when it is known, waits in the data pull request or failed twice"
        type: boolean
        default: false
      verify-only:
        description: "Only verify and upload the report (no issue, no pull request; captures known builds too)"
        type: boolean
        default: false

permissions: {}

env:
  # A BDS build number: the format of `BuildNumber` (tools), whose test keeps this regex equal to BuildNumber.REGEX
  BUILD_RE: '^1(\.[0-9]{1,9}){3}$'

concurrency:
  group: bds-data
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.decide.outputs.matrix }}
      captures: ${{ steps.decide.outputs.captures }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The only step with the token, before any repository code runs: gh and nothing else
      - name: List the open issues and pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --repo "$GITHUB_REPOSITORY" --label bds-data --state open --limit 100 \
            --json number,title,author,body > "$RUNNER_TEMP/issues.json"
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,headRefName,isCrossRepository,body > "$RUNNER_TEMP/pulls.json"
      - uses: ./.github/actions/setup-tools
      - name: Decide
        id: decide
        env:
          CHANNEL: ${{ inputs.channel || 'both' }}
          INPUT_VERSION: ${{ inputs.version }}
          FORCE: ${{ inputs.force == true || inputs.verify-only == true }}
          COMMIT: ${{ github.sha }}
        run: |
          ARGS=(daily decide --channel "$CHANNEL" --commit "$COMMIT" --issues "$RUNNER_TEMP/issues.json"
            --pulls "$RUNNER_TEMP/pulls.json" --outputs "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY")
          if [ -n "$INPUT_VERSION" ]; then ARGS+=(--version "$INPUT_VERSION"); fi
          if [ "$FORCE" = true ]; then ARGS+=(--force); fi
          "$TOOLS" "${ARGS[@]}"

  capture:
    needs: decide
    if: needs.decide.outputs.captures != '0'
    # A fixed image: the captures are compared byte for byte with captures from earlier runs, so a runner image bump
    # (file listing order, locale) must be a deliberate change (docs/updating.md, "Pins")
    runs-on: windows-2025
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.decide.outputs.matrix) }}
    # One job at a time per build across both data workflows, so no two download the same zip
    concurrency:
      group: bds-zip-${{ matrix.build }}
      cancel-in-progress: false
    defaults:
      run:
        # Git Bash on the Windows runner
        shell: bash
    env:
      CHANNEL: ${{ matrix.channel }}
      BDS_VERSION: ${{ matrix.build }}
      # Scheduled runs have no inputs: false
      VERIFY_ONLY: ${{ inputs.verify-only == true }}
    steps:
      - name: Check the matrix values
        run: |
          echo "$BDS_VERSION" | grep -Eq "$BUILD_RE" || { echo "Bad build"; exit 1; }
          echo "$CHANNEL" | grep -Eqx 'release|preview' || { echo "Bad channel"; exit 1; }
      # The data is compared byte for byte: keep the checkout's line endings as committed (LF)
      - name: Check out with LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Java, Gradle with a read-only cache (untrusted code runs here), $CI_TEMP, $PALETTER_BDS_CACHE, the tools launcher
      # $TOOLS (it passes their exit code on; 2: decisions open) and the zips of the build, saved before BDS runs
      - uses: ./.github/actions/setup-tools
        with:
          build: ${{ matrix.build }}
          channel: ${{ matrix.channel }}

      # One pass: verify-only for a manual verify-only run, else update, which writes into the checkout only (publish
      # turns the patch into a pull request). The result is written last, after the patch exists, so a failure on the
      # way (including the code generation) can never look like "no changes".
      - name: Run the update
        id: run
        run: |
          set +e
          OUT="$CI_TEMP/out"
          DATA_PATHS="data paletter/src/main/resources/paletter paletter/src/generated paletter/api"
          if [ "$VERIFY_ONLY" = true ]; then
            "$TOOLS" update --channel "$CHANNEL" --version "$BDS_VERSION" --verify-only
          else
            "$TOOLS" update --channel "$CHANNEL" --version "$BDS_VERSION"
          fi
          # The tool's own exit code: 2 tells decisions from failures
          CODE=$?
          # Every run also writes its report into its work directory, which starts empty
          for f in "$PALETTER_BDS_CACHE"/runs/*-"$BDS_VERSION"/report.md; do
            if [ -f "$f" ]; then cp "$f" "$OUT/report.md"; fi
          done
          VERDICT=""
          ADDON=false
          if [ -f "$OUT/report.md" ]; then
            # The report without the lines that change every run (date, paths)
            HASH=$(grep -v -e '^- \*\*Date\*\*' -e '^- \*\*Work directory' -e '^- \*\*Server' "$OUT/report.md" | sha256sum | cut -c1-16)
            VERDICT=$(grep -m1 -E '^(OK|Changed|Failed): ' "$OUT/report.md")
            head -c 60000 "$OUT/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            # No report to compare: every such failure is new
            HASH="$GITHUB_RUN_ID"
          fi
          DIFFERS=true
          if [ "$VERIFY_ONLY" != true ] && { [ "$CODE" = 0 ] || [ "$CODE" = 2 ]; }; then
            # The component API follows the inferred mappings, the API dump follows the component API. Separate runs:
            # the dump compiles what the generator wrote
            if ! { ./gradlew :tools:generateComponentApi && ./gradlew :paletter:apiDump; }; then
              echo "::error::The data was updated, but generateComponentApi or apiDump failed"
              CODE=3
            fi
            # Only the data paths, new files included, without renames (publish checks every path)
            git add -A -- $DATA_PATHS
            # Clean: the report has nothing to say and no data file changed. update writes its report into the data only
            # with a data change; the exclusion keeps a report alone from ever counting as one
            if [ "$CODE" = 0 ] && [ "$VERDICT" = "OK: no changes" ] \
                && git diff --cached --quiet -- $DATA_PATHS ':(exclude)data/bds/*/update-report.md'; then
              DIFFERS=false
            elif [ "$CODE" = 0 ] || [ "$CODE" = 2 ]; then
              git diff --cached --binary --no-renames -- $DATA_PATHS > "$OUT/data.patch"
              # An add-on input changed: the kept builds answer for the old add-on until a recapture (said in the pull request)
              if git diff --cached --name-only -- data/model | grep -Eq '^data/model/(components|fixtures|bds-feedback|bds-keys)\.json$'; then
                ADDON=true
              fi
            fi
          elif [ "$CODE" = 0 ]; then
            DIFFERS=false
          fi
          {
            echo "exit=$CODE"
            echo "differs=$DIFFERS"
            echo "hash=$HASH"
            echo "addon=$ADDON"
          } >> "$GITHUB_OUTPUT"
          exit 0

      # What publish reads: values only, checked again there. A step that died before its outputs counts as a failure
      - name: Write the result
        if: always()
        env:
          UPDATE_EXIT: ${{ steps.run.outputs.exit || '1' }}
          DIFFERS: ${{ steps.run.outputs.differs || 'true' }}
          HASH: ${{ steps.run.outputs.hash || github.run_id }}
          ADDON: ${{ steps.run.outputs.addon || 'false' }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          {
            echo "version=$BDS_VERSION"
            echo "update=$UPDATE_EXIT"
            echo "differs=$DIFFERS"
            echo "hash=$HASH"
            echo "addon=$ADDON"
          } > "$RUNNER_TEMP/out/result.txt"

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bds-data-${{ matrix.channel }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: ignore

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bds-logs-${{ matrix.channel }}
          path: |
            ${{ env.PALETTER_BDS_CACHE }}/runs/*/*.log
            ${{ env.PALETTER_BDS_CACHE }}/runs/*/report.md
          if-no-files-found: ignore

  publish:
    needs: [decide, capture]
    if: ${{ !cancelled() && needs.decide.result == 'success' && needs.decide.outputs.captures != '0' && inputs.verify-only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.decide.outputs.matrix) }}
    env:
      CHANNEL: ${{ matrix.channel }}
      BUILD: ${{ matrix.build }}
      ATTEMPT: ${{ matrix.attempt }}
      # The issue of a failed check (DailyDecide.issueTitle); only an open issue with this title by github-actions is
      # updated or closed, never one a human filed (OWN_ISSUE: jq over `gh issue list --json number,title,author`)
      ISSUE_TITLE: "BDS data: the ${{ matrix.channel }} check failed"
      OWN_ISSUE: >-
        [.[] | select(.title == $title and (.author.login | IN("app/github-actions", "github-actions", "github-actions[bot]")))][0].number // empty
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bds-data-${{ matrix.channel }}
          path: ${{ runner.temp }}/in

      # Values from the capture job and the matrix are data: checked against strict patterns, never sourced or interpolated
      - name: Read the result
        id: result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$BUILD" | grep -Eq "$BUILD_RE" || { echo "Bad build"; exit 1; }
          echo "$CHANNEL" | grep -Eqx 'release|preview' || { echo "Bad channel"; exit 1; }
          echo "$ATTEMPT" | grep -Eq '^[12]$' || { echo "Bad attempt"; exit 1; }
          IN="$RUNNER_TEMP/in"
          value() { grep -m1 "^$1=" "$IN/result.txt" | cut -d= -f2-; }
          VERSION=$(value version); UPDATE=$(value update); DIFFERS=$(value differs); HASH=$(value hash); ADDON=$(value addon)
          [ "$VERSION" = "$BUILD" ] || { echo "The result is not of $BUILD"; exit 1; }
          echo "$UPDATE" | grep -Eq '^[0-9]+$' || { echo "Bad update exit code"; exit 1; }
          echo "$DIFFERS" | grep -Eq '^(true|false)$' || { echo "Bad differs"; exit 1; }
          echo "$HASH" | grep -Eq '^[0-9a-f]+$' || { echo "Bad hash"; exit 1; }
          echo "$ADDON" | grep -Eq '^(true|false)$' || { echo "Bad addon"; exit 1; }
          ISSUE=$(gh issue list --label bds-data --label "$CHANNEL" --state open --json number,title,author | jq -r --arg title "$ISSUE_TITLE" "$OWN_ISSUE")
          {
            echo "update=$UPDATE"
            echo "differs=$DIFFERS"
            echo "hash=$HASH"
            echo "addon=$ADDON"
            echo "issue=$ISSUE"
          } >> "$GITHUB_OUTPUT"

      # A failure only: new data is a pull request alone. The marker is what `daily decide` reads (one retry per build and
      # commit); the report hash keeps a standing failure from commenting every day
      - name: Open or update the issue
        if: steps.result.outputs.update != '0' && steps.result.outputs.update != '2'
        env:
          GH_TOKEN: ${{ github.token }}
          HASH: ${{ steps.result.outputs.hash }}
          NUMBER: ${{ steps.result.outputs.issue }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create bds-data --color 1d76db --description "Automated BDS data check" 2>/dev/null || true
          gh label create "$CHANNEL" --color c5def5 2>/dev/null || true
          BODY="$RUNNER_TEMP/issue.md"
          {
            echo "<!-- bds-check: $BUILD $COMMIT $ATTEMPT -->"
            echo "<!-- report-hash: $HASH -->"
            echo "BDS $BUILD failed (attempt $ATTEMPT at $COMMIT). Run: $RUN_URL"
            echo
            # GitHub limits bodies to 65536 characters
            if [ -f "$RUNNER_TEMP/in/report.md" ]; then head -c 60000 "$RUNNER_TEMP/in/report.md"; else echo "The run wrote no report; see the logs."; fi
          } > "$BODY"
          if [ -z "$NUMBER" ]; then
            gh issue create --title "$ISSUE_TITLE" --label bds-data --label "$CHANNEL" --body-file "$BODY"
          else
            # The body carries the newest marker; a comment only when the report says something new
            if ! gh issue view "$NUMBER" --json body --jq .body | grep -qF "<!-- report-hash: $HASH -->"; then
              gh issue comment "$NUMBER" --body "BDS $BUILD failed again, with another report (attempt $ATTEMPT). Run: $RUN_URL"
            fi
            gh issue edit "$NUMBER" --body-file "$BODY"
          fi

      # Not on a manual run of an explicit version: an older or other build being clean says nothing about the newest
      - name: Close the issue of a clean run
        if: steps.result.outputs.update == '0' && steps.result.outputs.differs == 'false' && steps.result.outputs.issue != '' && !inputs.version
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.result.outputs.issue }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh issue close "$NUMBER" --comment "BDS $BUILD matches the committed data (run $RUN_URL)"

      # Only patches confined to the data paths (the checks shared with recapture.yml); anything else fails the job before
      # the working tree changes
      - name: Apply the data
        id: apply
        if: steps.result.outputs.differs == 'true' && (steps.result.outputs.update == '0' || steps.result.outputs.update == '2')
        uses: ./.github/actions/apply-data-patch
        with:
          patch: ${{ runner.temp }}/in/data.patch
          # Whether the token that makes the build run on the pull request is set (never the token itself)
          has-token: ${{ secrets.BDS_DATA_TOKEN != '' }}

      # The versioned report, committed with the data, is the pull request body; when the patch has none (only
      # regenerated code changed), the run's own copy of it. The marker tells `daily decide` that the build waits here
      - name: Write the pull request body
        if: steps.apply.outputs.changed == 'true'
        env:
          ADDON: ${{ steps.result.outputs.addon }}
          NUMBER: ${{ steps.result.outputs.issue }}
        run: |
          REPORT="data/bds/$BUILD/update-report.md"
          grep -qxF "$REPORT" "$RUNNER_TEMP/paths.txt" || REPORT="$RUNNER_TEMP/in/report.md"
          {
            echo "<!-- bds-check: $BUILD -->"
            if [ -n "$NUMBER" ]; then echo "Closes #$NUMBER"; echo; fi
            # Nothing recaptures by itself: the kept builds answer for the old add-on until someone does (docs/data-pipeline.md)
            if [ "$ADDON" = true ]; then
              echo "**The update changed an input of the spec add-on.** Label this pull request \`recapture\` before merging, so the kept builds are captured with the new add-on."
              echo
            fi
            head -c 60000 "$REPORT"
          } > "$RUNNER_TEMP/pr-body.md"

      - name: Open or update the pull request
        if: steps.apply.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.BDS_DATA_TOKEN || github.token }}
          branch: bds-data/${{ matrix.channel }}
          delete-branch: true
          title: "Update bundled data from the newest BDS ${{ matrix.channel }}"
          commit-message: "Update bundled data from BDS ${{ matrix.build }}"
          body-path: ${{ runner.temp }}/pr-body.md
          labels: bds-data
          add-paths: |
            data/**
            paletter/src/main/resources/paletter/**
            paletter/src/generated/**
            paletter/api/**

      - name: Fail on a failed update
        if: steps.result.outputs.update != '0' && steps.result.outputs.update != '2'
        env:
          UPDATE: ${{ steps.result.outputs.update }}
        run: |
          if [ "$UPDATE" = 3 ]; then
            echo "update wrote the data, but generateComponentApi or apiDump failed on it; see the capture job's log"
          else
            echo "update failed with exit code $UPDATE; see the bds-logs artifact"
          fi
          exit 1
