# Security: the job that runs untrusted code (the downloaded BDS binary, Gradle and its dependencies, the tools) is
# `capture`. It can only read the repository, keeps no credentials in the checkout and sees no secrets. It hands over the
# report and a patch of the data paths as artifacts. `publish` holds the write permissions and BDS_DATA_TOKEN, runs no
# Gradle, BDS or repository script, applies only patches confined to the data paths and passes report text as files.
#
# Daily check of the newest Bedrock Dedicated Server release and preview against the committed data.
#
# Per channel: resolves the newest build (or the `version` input), then runs `update` once on Windows BDS (downloaded
# from minecraft.net; that means accepting the Minecraft EULA, https://minecraft.net/eula). The committed captures come
# from Windows BDS, and Linux BDS numbers custom blocks, orders the creative inventory and encodes some component NBT
# differently, so the captures run on Windows too (`update` refuses to compare captures of different platforms). The
# update writes into the checkout and its report says whether anything differs; the component API and the API dump are
# regenerated from the result. When the run fails or finds differences:
#   - an issue labelled `bds-data` + `<channel>` is opened, or the open one gets a comment when the report changed
#     (dates and paths ignored), so a standing difference does not spam;
#   - `peter-evans/create-pull-request` opens (or updates) a pull request from branch `bds-data/<channel>` with the new
#     data. Releases and previews are imported alike: a preview is bundled as a preview version (served with
#     `Builder.previews(true)`, its API marked `@SincePreview`) and replaces the preview before it; its release drops it. The
#     update writes its report to `data/bds/<build>/update-report.md` (committed with the data, and the body of the
#     pull request). It exits with 2 when the report lists decisions: the pull request is still opened, for a human to
#     decide them; any other failure fails the run after the issue is updated. Gradle's run task reports every
#     non-zero exit as 1, so the step reads the tool's own exit code from `exit-code` in its work directory.
# When a run is clean (no failure, no difference, no data file changed), the open issue of its channel that this workflow
# opened (author github-actions, its exact title) is closed with a comment; a manual run of an explicit `version` closes
# nothing. An update that changes no data file does not write its report into the data, so a clean run has no patch.
# A manual run can check one channel only, and with `verify-only` runs `update --verify-only` and stops after the report
# (nothing written, no issue, no pull request).
#
# Windows runner assumptions: BDS and the capture client talk over loopback only (127.0.0.1: RakNet and NetherNet
# signaling on server-port, NetherNet LAN discovery on UDP 7551). Windows Firewall does not filter loopback, and nothing
# runs elevated or needs a UWP loopback exemption (that is only for the Bedrock client app). NetherNet's WebRTC uses
# host candidates only (no STUN/TURN), and libdatachannel ships a Windows x64 native. No WSL is needed: the tools run
# the Windows BDS directly; only the BDS inventory step downloads the Linux zip to read its binary.
#
# Pull requests opened with GITHUB_TOKEN do not trigger other workflows; to run the build on them, use a fine grained
# PAT (contents + pull requests: read and write) in a `BDS_DATA_TOKEN` secret, which `publish` prefers when it exists.
# A patch that changes generated code (paletter/src/generated) is only turned into a pull request with that token, so
# the build always checks generated code before review; without it `publish` fails and says so. The repository setting
# "Allow GitHub Actions to create and approve pull requests" must be enabled. See docs/releasing.md.

name: BDS data

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel to check"
        type: choice
        options: [both, release, preview]
        default: both
      version:
        description: "BDS version (empty: newest of each channel)"
        required: false
      verify-only:
        description: "Only verify and upload the report (no issue, no pull request)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: bds-data
  cancel-in-progress: false

jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(inputs.channel == 'release' && '["release"]' || inputs.channel == 'preview' && '["preview"]' || '["release","preview"]') }}
    defaults:
      run:
        # Git Bash on the Windows runner
        shell: bash
    env:
      CHANNEL: ${{ matrix.channel }}
      INPUT_VERSION: ${{ inputs.version }}
      # Scheduled runs have no inputs: false
      VERIFY_ONLY: ${{ inputs.verify-only == true }}
    steps:
      # Everything temporary lives in the runner's temp directory, never in the checkout. Forward slashes: Java, bash
      # and the actions all read them; outside the checkout as an absolute path, as upload-artifact rejects '..'.
      - name: Set the temp and BDS cache directories
        run: |
          CI_TEMP=$(cygpath -m "$RUNNER_TEMP")
          echo "CI_TEMP=$CI_TEMP" >> "$GITHUB_ENV"
          echo "PALETTER_BDS_CACHE=$CI_TEMP/bds-cache" >> "$GITHUB_ENV"
          mkdir -p "$CI_TEMP/out"
      # The data is compared byte for byte: keep the checkout's line endings as committed (LF)
      - name: Check out with LF line endings
        run: git config --global core.autocrlf false
      # The build every step uses, also the key of the download cache
      - name: Resolve the BDS version
        id: bds
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            TYPE=serverBedrockWindows
            if [ "$CHANNEL" = preview ]; then TYPE=serverBedrockPreviewWindows; fi
            URL=$(curl -sf -A Paletter https://net-secondary.web.minecraft-services.net/api/v1.0/download/links \
              | jq -r --arg type "$TYPE" '.result.links[] | select(.downloadType == $type) | .downloadUrl')
            VERSION=$(basename "$URL" .zip | sed 's/^bedrock-server-//')
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+)+$'; then echo "No BDS version: '$VERSION'"; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "BDS_VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Untrusted code runs here: it must not write the Gradle cache that other jobs restore
          cache-read-only: true
      - name: Cache BDS downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PALETTER_BDS_CACHE }}/zips
          key: bds-zips-windows-${{ matrix.channel }}-${{ steps.bds.outputs.version }}

      # One pass: verify-only for a manual verify-only run, else update, which writes into the checkout only (publish
      # turns the patch into a pull request). The result is written last, after the patch exists, so a failure on the
      # way (including the code generation) can never look like "no changes".
      - name: Run the update
        id: run
        run: |
          set +e
          OUT="$CI_TEMP/out"
          DATA_PATHS="data paletter/src/main/resources/paletter paletter/src/generated paletter/api"
          if [ "$VERIFY_ONLY" = true ]; then
            ./gradlew :tools:run --args="update --channel $CHANNEL --version $BDS_VERSION --verify-only"
          else
            ./gradlew :tools:run --args="update --channel $CHANNEL --version $BDS_VERSION"
          fi
          CODE=$?
          # Every run also writes its report and its exit code into its work directory, which starts empty. Gradle exits
          # with 1 on any non-zero exit of the tool; the file tells decisions (2) from failures
          for f in "$PALETTER_BDS_CACHE"/runs/*-"$BDS_VERSION"/report.md; do
            if [ -f "$f" ]; then cp "$f" "$OUT/report.md"; fi
          done
          if [ "$CODE" != 0 ]; then
            for f in "$PALETTER_BDS_CACHE"/runs/*-"$BDS_VERSION"/exit-code; do
              if [ -f "$f" ] && grep -Eqx '[1-9][0-9]*' "$f"; then CODE=$(grep -Exm1 '[1-9][0-9]*' "$f"); fi
            done
          fi
          VERDICT=""
          if [ -f "$OUT/report.md" ]; then
            # The report without the lines that change every run (date, paths)
            HASH=$(grep -v -e '^- \*\*Date\*\*' -e '^- \*\*Work directory' -e '^- \*\*Server' "$OUT/report.md" | sha256sum | cut -c1-16)
            VERDICT=$(grep -m1 -E '^(OK|Changed|Failed): ' "$OUT/report.md")
            head -c 60000 "$OUT/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            # No report to compare: every such failure is new
            HASH="$GITHUB_RUN_ID"
          fi
          DIFFERS=true
          if [ "$VERIFY_ONLY" != true ] && { [ "$CODE" = 0 ] || [ "$CODE" = 2 ]; }; then
            # The component API follows the inferred mappings, the API dump follows the component API. Separate runs:
            # the dump compiles what the generator wrote
            if ! { ./gradlew :tools:generateComponentApi && ./gradlew :paletter:apiDump; }; then
              echo "::error::The data was updated, but generateComponentApi or apiDump failed"
              CODE=3
            fi
            # Only the data paths, new files included, without renames (publish checks every path)
            git add -A -- $DATA_PATHS
            # Clean: the report has nothing to say and no data file changed. update writes its report into the data only
            # with a data change; the exclusion keeps a report alone from ever counting as one
            if [ "$CODE" = 0 ] && [ "$VERDICT" = "OK: no changes" ] \
                && git diff --cached --quiet -- $DATA_PATHS ':(exclude)data/bds/*/update-report.md'; then
              DIFFERS=false
            elif [ "$CODE" = 0 ] || [ "$CODE" = 2 ]; then
              git diff --cached --binary --no-renames -- $DATA_PATHS > "$OUT/data.patch"
            fi
          elif [ "$CODE" = 0 ]; then
            DIFFERS=false
          fi
          {
            echo "exit=$CODE"
            echo "differs=$DIFFERS"
            echo "hash=$HASH"
          } >> "$GITHUB_OUTPUT"
          exit 0

      # What publish reads: values only, checked again there. A step that died before its outputs counts as a failure
      - name: Write the result
        if: always()
        env:
          UPDATE_EXIT: ${{ steps.run.outputs.exit || '1' }}
          DIFFERS: ${{ steps.run.outputs.differs || 'true' }}
          HASH: ${{ steps.run.outputs.hash || github.run_id }}
        run: |
          {
            echo "version=$BDS_VERSION"
            echo "update=$UPDATE_EXIT"
            echo "differs=$DIFFERS"
            echo "hash=$HASH"
          } > "$CI_TEMP/out/result.txt"

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bds-data-${{ matrix.channel }}
          path: ${{ env.CI_TEMP }}/out/
          if-no-files-found: ignore

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bds-logs-${{ matrix.channel }}
          path: |
            ${{ env.PALETTER_BDS_CACHE }}/runs/*/*.log
            ${{ env.PALETTER_BDS_CACHE }}/runs/*/report.md
          if-no-files-found: ignore

  publish:
    needs: capture
    if: ${{ !cancelled() && inputs.verify-only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One key per channel: the legs of a matrix cannot share an output name. Set by the leg of that channel only
    outputs:
      addon-release: ${{ steps.addon.outputs.addon-release }}
      addon-preview: ${{ steps.addon.outputs.addon-preview }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(inputs.channel == 'release' && '["release"]' || inputs.channel == 'preview' && '["preview"]' || '["release","preview"]') }}
    env:
      CHANNEL: ${{ matrix.channel }}
      # The issue this workflow opens; only an open issue with this title by github-actions is commented on or closed,
      # never one a human filed with the same labels (OWN_ISSUE: jq over `gh issue list --json number,title,author`)
      ISSUE_TITLE: "BDS data: ${{ matrix.channel }} differs from the committed data"
      OWN_ISSUE: >-
        [.[] | select(.title == $title and (.author.login | IN("app/github-actions", "github-actions", "github-actions[bot]")))][0].number // empty
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: the data pull request is compared with the base after it was pushed
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bds-data-${{ matrix.channel }}
          path: ${{ runner.temp }}/in

      # Values from the capture job are data: checked against strict patterns, never sourced or interpolated
      - name: Read the result
        id: result
        run: |
          IN="$RUNNER_TEMP/in"
          value() { grep -m1 "^$1=" "$IN/result.txt" | cut -d= -f2-; }
          VERSION=$(value version); UPDATE=$(value update); DIFFERS=$(value differs); HASH=$(value hash)
          echo "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+)+$' || { echo "Bad version"; exit 1; }
          echo "$UPDATE" | grep -Eq '^[0-9]+$' || { echo "Bad update exit code"; exit 1; }
          echo "$DIFFERS" | grep -Eq '^(true|false)$' || { echo "Bad differs"; exit 1; }
          echo "$HASH" | grep -Eq '^[0-9a-f]+$' || { echo "Bad hash"; exit 1; }
          {
            echo "version=$VERSION"
            echo "update=$UPDATE"
            echo "differs=$DIFFERS"
            echo "hash=$HASH"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update the issue
        if: steps.result.outputs.differs == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HASH: ${{ steps.result.outputs.hash }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create bds-data --color 1d76db --description "Automated BDS data check" 2>/dev/null || true
          gh label create "$CHANNEL" --color c5def5 2>/dev/null || true
          ISSUE="$RUNNER_TEMP/issue.md"
          MARKER="<!-- report-hash: $HASH -->"
          {
            echo "$MARKER"
            echo "Run: $RUN_URL"
            echo
            # GitHub limits bodies to 65536 characters
            if [ -f "$RUNNER_TEMP/in/report.md" ]; then head -c 60000 "$RUNNER_TEMP/in/report.md"; else echo "The run wrote no report; see the logs."; fi
          } > "$ISSUE"
          NUMBER=$(gh issue list --label bds-data --label "$CHANNEL" --state open --json number,title,author | jq -r --arg title "$ISSUE_TITLE" "$OWN_ISSUE")
          if [ -z "$NUMBER" ]; then
            gh issue create --title "$ISSUE_TITLE" --label bds-data --label "$CHANNEL" --body-file "$ISSUE"
          elif ! gh issue view "$NUMBER" --json body,comments --jq '[.body] + [.comments[].body] | join("\n")' | grep -qF "$MARKER"; then
            gh issue comment "$NUMBER" --body-file "$ISSUE"
          else
            echo "Issue #$NUMBER already has this report"
          fi

      # Not on a manual run of an explicit version: an older or other build being clean says nothing about the newest
      - name: Close the issue of a clean run
        if: steps.result.outputs.differs == 'false' && !inputs.version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.result.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          NUMBER=$(gh issue list --label bds-data --label "$CHANNEL" --state open --json number,title,author | jq -r --arg title "$ISSUE_TITLE" "$OWN_ISSUE")
          if [ -n "$NUMBER" ]; then
            gh issue close "$NUMBER" --comment "BDS $VERSION matches the committed data. Run: $RUN_URL"
          fi

      # Only patches confined to the data paths; anything else fails the job before the working tree changes
      - name: Apply the data
        id: apply
        if: steps.result.outputs.differs == 'true' && (steps.result.outputs.update == '0' || steps.result.outputs.update == '2')
        env:
          VERSION: ${{ steps.result.outputs.version }}
          # Whether the token that makes the build run on the pull request is set (never the token itself)
          HAS_TOKEN: ${{ secrets.BDS_DATA_TOKEN != '' }}
        run: |
          PATCH="$RUNNER_TEMP/in/data.patch"
          if [ ! -s "$PATCH" ]; then echo "No data changes"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          # One path per file (renames are rejected below); a quoted path with unusual characters fails the check below
          git apply --numstat "$PATCH" | cut -f3 > "$RUNNER_TEMP/paths.txt"
          if grep -Ev '^(data/|paletter/src/main/resources/paletter/|paletter/src/generated/|paletter/api/)' "$RUNNER_TEMP/paths.txt" \
              || grep -E '(^|/)\.' "$RUNNER_TEMP/paths.txt"; then
            echo "The patch touches paths outside the data paths or a hidden path"; exit 1
          fi
          # No renames or copies: --numstat lists only their new path, so the old one would go unchecked
          if grep -Eq '^(rename|copy) (from|to) ' "$PATCH"; then
            echo "The patch renames or copies a file"; exit 1
          fi
          # No symlinks or submodules: a link inside data/ could point anywhere
          if grep -Eq '^(new file|new|old|deleted file) mode (120000|160000)' "$PATCH"; then
            echo "The patch adds a symlink or submodule"; exit 1
          fi
          # Generated code is reviewed only after the build ran on it, and a pull request opened with GITHUB_TOKEN gets no build
          if [ "$HAS_TOKEN" != true ] && grep -q '^paletter/src/generated/' "$RUNNER_TEMP/paths.txt"; then
            echo "::error::The data changes generated code, and no BDS_DATA_TOKEN secret is set, so the build would not run on the pull request. Set BDS_DATA_TOKEN (see docs/releasing.md) and run this workflow again."
            exit 1
          fi
          git apply --check "$PATCH"
          git apply "$PATCH"
          # Check what the patch did, not only its headers: a patch whose --- and +++ paths differ moves a file without
          # rename lines, so every changed path of the working tree must be a data path
          git status --porcelain --untracked-files=all | cut -c4- | sed 's/^.* -> //' > "$RUNNER_TEMP/changed.txt"
          if grep -Ev '^"?(data/|paletter/src/main/resources/paletter/|paletter/src/generated/|paletter/api/)' "$RUNNER_TEMP/changed.txt"; then
            echo "The patch changed paths outside the data paths"; exit 1
          fi
          # The versioned report, committed with the data, is the pull request body; when the patch has none (only
          # regenerated code changed), the run's own copy of it
          BODY="data/bds/$VERSION/update-report.md"
          grep -qxF "$BODY" "$RUNNER_TEMP/paths.txt" || BODY="$RUNNER_TEMP/in/report.md"
          head -c 60000 "$BODY" > "$RUNNER_TEMP/pr-body.md"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update the pull request
        if: steps.apply.outputs.changed == 'true'
        id: pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.BDS_DATA_TOKEN || github.token }}
          branch: bds-data/${{ matrix.channel }}
          delete-branch: true
          title: "Update bundled data from the newest BDS ${{ matrix.channel }}"
          commit-message: "Update bundled data from the newest BDS ${{ matrix.channel }}"
          body-path: ${{ runner.temp }}/pr-body.md
          labels: bds-data
          add-paths: |
            data/**
            paletter/src/main/resources/paletter/**
            paletter/src/generated/**
            paletter/api/**

      # After the pull request exists: the recapture stacks its own on that branch (see the recapture jobs below). Only
      # when this run created or changed the pull request (a run that left it as it was has nothing new to recapture,
      # and must not start over what was merged into the branch since), and only when the pushed branch itself changes
      # an input of the capture add-on (the model, the fixtures, the feedback, the BDS keys): read from git here, in the
      # job that holds the token, never from anything the capture job handed over
      - name: Note a changed add-on
        id: addon
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.ref_name }}
        run: |
          echo "$BASE" | grep -Eq '^[A-Za-z0-9._/-]{1,100}$' || { echo "Not a branch name: '$BASE'"; exit 1; }
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=$AUTH" fetch --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE" \
            "+refs/heads/bds-data/$CHANNEL:refs/remotes/origin/bds-data/$CHANNEL"
          git diff --name-only "origin/$BASE...origin/bds-data/$CHANNEL" -- data/model > "$RUNNER_TEMP/model-paths.txt"
          if grep -Eq '^data/model/(components|fixtures|bds-feedback|bds-keys)\.json$' "$RUNNER_TEMP/model-paths.txt"; then
            echo "addon-$CHANNEL=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail on a failed update
        if: steps.result.outputs.update != '0' && steps.result.outputs.update != '2'
        env:
          UPDATE: ${{ steps.result.outputs.update }}
        run: |
          if [ "$UPDATE" = 3 ]; then
            echo "update wrote the data, but generateComponentApi or apiDump failed on it; see the capture job's log"
          else
            echo "update failed with exit code $UPDATE; see the bds-logs artifact"
          fi
          exit 1

  # A new build whose schema or model changes the capture add-on: every kept build is captured again with it, in the
  # recapture workflow, which opens one more pull request on the branch of the data update. The model change merges
  # only after that pull request (docs/data-pipeline.md, "Full recapture"). One branch per run: the release one when
  # both channels changed the add-on; start recapture.yml by hand for the other.
  recapture-plan:
    needs: publish
    if: ${{ !cancelled() && inputs.verify-only != true && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
    steps:
      # The decision comes from the publish job's outputs (read from git there), not from an artifact the capture job
      # of this run could have forged
      - name: Pick the branch
        id: pick
        env:
          ADDON_RELEASE: ${{ needs.publish.outputs.addon-release }}
          ADDON_PREVIEW: ${{ needs.publish.outputs.addon-preview }}
        run: |
          REF=""
          for channel in release preview; do
            case "$channel" in
              release) changed="$ADDON_RELEASE" ;;
              preview) changed="$ADDON_PREVIEW" ;;
            esac
            if [ "$changed" = true ]; then
              if [ -n "$REF" ]; then echo "::notice::The $channel update changes the add-on too: run recapture.yml on bds-data/$channel by hand"; continue; fi
              REF="bds-data/$channel"
            fi
          done
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

  recapture:
    needs: recapture-plan
    if: ${{ !cancelled() && needs.recapture-plan.outputs.ref != '' }}
    # The most the called workflow may use: its publish job
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/recapture.yml
    with:
      ref: ${{ needs.recapture-plan.outputs.ref }}
    secrets:
      BDS_DATA_TOKEN: ${{ secrets.BDS_DATA_TOKEN }}
